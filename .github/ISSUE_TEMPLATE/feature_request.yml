name: 功能建议
description: 提想法，或希望接入的模型供应商
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你希望的功能
      placeholder: |
        例如：希望接入某个提供 Anthropic 兼容端点的供应商（请附它的文档链接），
        或控制台里缺少的某个操作。目前支持的是官方 Claude、Kimi、DeepSeek。
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 用在什么场景 / 为什么需要
    validations:
      required: false
