name: Bug 反馈
description: 报告一个问题（起不来、报错、行为不对）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全，能大幅加快定位。**贴日志前务必先删掉任何 API key / 令牌。**
  - type: input
    id: version
    attributes:
      label: CSSwitch 版本
      description: 控制台页眉右侧显示的版本号；从源码运行的请同时给出 commit（`git rev-parse --short HEAD`）
      placeholder: v0.9.0
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: 使用方式
      options:
        - 安装版（CSSwitch.app）
        - 从源码运行（./csswitch）
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本 + 芯片
      placeholder: macOS 15.5 / Apple M2
    validations:
      required: true
  - type: input
    id: science
    attributes:
      label: Claude Science 版本
      description: Science 设置页 → About
      placeholder: 0.1.60
    validations:
      required: false
  - type: dropdown
    id: mode
    attributes:
      label: 出问题时的连接模式
      options:
        - 官方 Claude
        - Kimi
        - DeepSeek
        - 与模式无关（启动、控制台、免登录沙箱等）
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 CSSwitch，控制台切换到 Kimi
        2. 在 Science 里新开一个会话，发送……
        3. ……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望结果 / 实际结果（含完整报错文字）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选，强烈建议）
      description: |
        安装版：`~/.csswitch/service.log` 里出问题那一刻前后的几行。
        从源码运行：运行 `./csswitch` 的那个终端里的输出。
        控制台「请求日志」卡片里对应的那一行也有帮助。日志不含 key 与对话内容，但贴之前请自己再看一眼。
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: 确认
      options:
        - label: 我已确认贴出的内容里不含 API key、令牌等任何密钥
          required: true
