<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSSwitch</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #ffffff; --line: #e8e3dc; --ink: #1f1d1b;
    --muted: #6f6862; --accent: #c96442; --accent-soft: #f6ece8;
    --ok: #2f7d5b; --warn: #a8621b; --err: #b4402c;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917; --panel: #232120; --line: #35312e; --ink: #f2efec;
      --muted: #a39b94; --accent: #e07a55; --accent-soft: #33261f;
      --ok: #6fce9f; --warn: #e0a35a; --err: #ef8a76;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  /* 图标自带深色底板:深色主题下靠一圈细线与页面背景分开(圆角与底板一致,185/824)。 */
  .logo { align-self: center; flex: none; border-radius: 22.5%; box-shadow: 0 0 0 1px var(--line); }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .3px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  /* 免登录沙箱只有两个渠道可选(没有官方 Claude),两列排满。 */
  .modes.two { grid-template-columns: repeat(2, 1fr); }
  .mode {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    background: transparent; color: var(--ink); cursor: pointer; text-align: left;
    font: inherit; transition: border-color .15s, background .15s;
  }
  .mode:hover { border-color: var(--accent); }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  /* 切换请求进行中:不响应点击,也不出悬停态。 */
  .mode:disabled { opacity: .5; pointer-events: none; }
  .mode b { display: block; font-size: 15px; margin-bottom: 3px; }
  .mode span { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  button.act {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    font: inherit; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 6px 4px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; }
  input {
    width: 100%; font: inherit; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); margin: 0; }
  .check input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0; }
  legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: -6px; margin-bottom: 14px; }
  .msg { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-top: 12px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: var(--accent-soft); color: var(--ok); }
  .msg.err { background: var(--accent-soft); color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .logwrap { max-height: 300px; overflow: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <!-- 图形来自 packaging/icon/console-glyph.svg(gen.py 生成),内联以保持单文件;
         页签图标由下面的脚本取这同一份,不另存一份拷贝。 -->
    <svg class="logo" id="logo" viewBox="100 100 824 824" width="30" height="30" aria-hidden="true">
    <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a332e"/><stop offset="1" stop-color="#171412"/></linearGradient>
    <linearGradient id="lg-track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9d6e"/><stop offset="1" stop-color="#dd5a2e"/></linearGradient>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#lg-bg)"/>
    <g fill="none" stroke="#f6efe4" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="50" d="M362 512H402M622 512H662"/>
    <polyline stroke-width="60" points="340,188 353,206 369,224 387,242 407,260 428,278 451,296 475,314 499,332 523,350 546,368 569,386 589,404 608,422 624,440 638,458 649,476 657,494 662,512 664,530 662,548 658,566 650,584 640,602 627,620 612,638 596,656 578,674 559,692 539,710 519,728 500,746 482,764 464,782 448,800 435,818 423,836"/>
    <polyline stroke-width="60" points="601,188 589,206 576,224 560,242 542,260 524,278 505,296 485,314 465,332 446,350 428,368 412,386 397,404 384,422 374,440 366,458 362,476 360,494 362,512 367,530 375,548 386,566 400,584 416,602 435,620 455,638 478,656 501,674 525,692 549,710 573,728 596,746 617,764 637,782 655,800 671,818 684,836"/>
    </g>
    <rect x="394" y="437" width="236" height="150" rx="75" fill="url(#lg-track)"/>
    <circle cx="555" cy="512" r="61" fill="#ffffff"/>
    </svg>
    <h1>CSSwitch</h1>
    <span class="sub">Claude Science 模型连接</span>
    <span class="sub" id="version" style="margin-left:auto"></span>
  </header>

  <section class="card">
    <h2>当前连接</h2>
    <p class="hint" style="margin-top:0">你自己登录的 Science 用哪个 AI。</p>
    <div class="modes" id="modes"></div>
    <div class="row" style="margin-top:16px">
      <span class="pill"><span class="dot" id="sci-dot"></span><span id="sci-text">检查中…</span></span>
      <span class="pill">网关 <code id="base-url">—</code></span>
      <button class="act" id="btn-start">启动 Science</button>
      <button class="act" id="btn-stop">停止</button>
      <button class="act" id="btn-open">打开 Science</button>
      <button class="act" id="btn-quit" style="margin-left:auto">退出服务</button>
    </div>
    <div class="field" style="margin:16px 0 0">
      <label class="check">
        <input type="checkbox" id="web-search">
        <span>联网搜索</span>
      </label>
    </div>
    <div class="msg" id="mode-msg"></div>
  </section>

  <section class="card">
    <h2>免登录沙箱</h2>
    <p class="hint" style="margin-top:0">没有 Claude 订阅时用:一个独立的 Science,对话与上面的分开。</p>
    <div class="modes two" id="sb-modes" style="margin-bottom:16px"></div>
    <div class="row">
      <span class="pill"><span class="dot" id="sb-dot"></span><span id="sb-text">检查中…</span></span>
      <button class="act primary" id="btn-sb-start">启动沙箱</button>
      <button class="act" id="btn-sb-stop">停止</button>
      <button class="act" id="btn-sb-open">打开沙箱</button>
    </div>
    <div class="msg" id="sb-msg"></div>
  </section>

  <section class="card">
    <h2>渠道配置</h2>
    <div class="tabs" id="tabs">
      <button class="tab" data-ch="kimi" aria-selected="true">Kimi</button>
      <button class="tab" data-ch="deepseek" aria-selected="false">DeepSeek</button>
    </div>
    <form id="cfg">
      <div class="field">
        <label for="base">地址 base_url</label>
        <input id="base" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="key">API Key</label>
        <input id="key" type="password" autocomplete="off" placeholder="已保存,留空则保持不变">
      </div>
      <div class="row" style="margin-bottom:12px">
        <button type="button" class="act" id="btn-probe">获取可用模型</button>
        <span class="sub" id="probe-note"></span>
      </div>
      <div class="slots" id="slots"></div>
      <div class="row" style="margin-top:14px">
        <button type="submit" class="act primary">保存配置</button>
        <span class="sub">重启 Science 后生效。</span>
      </div>
      <div class="msg" id="cfg-msg"></div>
    </form>
  </section>

  <section class="card">
    <h2>请求日志</h2>
    <div class="field" style="margin-bottom:12px">
      <label class="check">
        <input type="checkbox" id="request-log">
        <span>记录请求日志</span>
      </label>
      <div class="msg" id="log-msg"></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button class="act" id="btn-logs">刷新</button>
      <span class="sub">不记录凭证与消息内容。</span>
    </div>
    <div class="logwrap">
      <table>
        <thead><tr><th>时间</th><th>实例 · 渠道</th><th>方法</th><th>路径</th><th>状态</th><th>耗时</th></tr></thead>
        <tbody id="logs"><tr><td colspan="6" class="sub">暂无记录</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const MODES = [
  { id: 'official', name: '官方 Claude', desc: '直连 api.anthropic.com' },
  { id: 'kimi',     name: 'Kimi',        desc: 'api.kimi.com/coding' },
  { id: 'deepseek', name: 'DeepSeek',    desc: 'api.deepseek.com/anthropic' },
];
const SLOTS = [
  { key: 'default_model', label: '默认模型(均衡)', required: true },
  { key: 'quality_model', label: '高质量模型(可选)' },
  { key: 'fast_model',    label: '快速模型(可选)' },
  { key: 'fable_model',   label: 'Fable 模型(可选)' },
];
// 请求日志里的实例名:正式实例(用户自己登录的 Science)与免登录沙箱。
const INSTANCES = { official: '正式', sandbox: '沙箱' };
let state = null;
let channel = 'kimi';
let scienceUrl = null;
// 沙箱渠道的切换请求是否在途(带重启时要好几秒)。在途时两张沙箱渠道卡片禁用。
let sandboxSwitching = false;

const $ = (id) => document.getElementById(id);

// 页签图标就是页眉里那份内联 SVG:只留一份图形,也不引任何外部文件。
// 在读状态之前设置,服务连不上、或退出后页眉被换掉,页签图标都还在。
(() => {
  const icon = document.createElement('link');
  icon.rel = 'icon';
  icon.type = 'image/svg+xml';
  icon.href = 'data:image/svg+xml,' + encodeURIComponent(new XMLSerializer().serializeToString($('logo')));
  document.head.append(icon);
})();

function msg(el, text, kind) {
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'ok');
  if (kind !== 'err') setTimeout(() => { el.className = 'msg'; }, 6000);
}

async function api(path, options) {
  const response = await fetch('/control/' + path, options);
  const data = await response.json().catch(() => ({ error: '响应不是 JSON' }));
  if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
  return data;
}

// 一组模式卡片。正式实例与免登录沙箱各一组,同一套渲染,各自绑定自己的切换动作。
function renderModeCards(container, modes, selected, onPick, disabled) {
  container.innerHTML = modes.map((mode) => `
    <button class="mode" data-mode="${mode.id}" aria-pressed="${selected === mode.id}"${disabled ? ' disabled' : ''}>
      <b>${mode.name}</b><span>${mode.desc}</span>
    </button>`).join('');
  container.querySelectorAll('.mode').forEach((button) => {
    button.onclick = () => onPick(button.dataset.mode);
  });
}

// 两组的选中态各取各的:正式实例看 state.mode,沙箱看 state.sandbox_mode。
// 沙箱没有「官方 Claude」这一项(它没有真实登录),不放一张按了不起作用的卡片。
function renderModes() {
  renderModeCards($('modes'), MODES, state.mode, (mode) => switchMode(mode));
  renderModeCards($('sb-modes'), MODES.filter((mode) => mode.id !== 'official'),
    state.sandbox_mode, switchSandboxMode, sandboxSwitching);
}

function renderSlots() {
  const config = state.channels[channel];
  $('base').value = config.base_url || '';
  $('key').placeholder = config.has_api_key ? '已保存,留空则保持不变' : '尚未配置';
  $('slots').innerHTML = SLOTS.map((slot) => {
    const value = config[slot.key] || { model_id: '', display_name: '' };
    return `<fieldset>
      <legend>${slot.label}</legend>
      <div class="field">
        <label>模型 ID</label>
        <input data-slot="${slot.key}" data-part="model_id" value="${value.model_id || ''}"
               placeholder="${slot.required ? '必填' : '留空则继承默认模型'}" spellcheck="false">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>显示名称(可选)</label>
        <input data-slot="${slot.key}" data-part="display_name" value="${value.display_name || ''}"
               placeholder="留空则使用模型 ID" spellcheck="false">
      </div>
    </fieldset>`;
  }).join('');
}

// 版本号取自正在运行的服务,不写死在页面里:页面与服务编在同一个二进制中,
// 这里显示的就是后台实际在跑的版本。更早的服务不报告版本号,那时留空。
function renderVersion() {
  $('version').textContent = state.version ? 'v' + state.version : '';
}

function renderScience() {
  const science = state.science || {};
  const running = !!science.running;
  $('sci-dot').className = 'dot ' + (running ? 'on' : 'off');
  $('sci-text').textContent = !science.installed
    ? '未找到 Claude Science'
    : (running ? 'Science 运行中' : 'Science 未运行');
  $('base-url').textContent = state.base_url;
  $('btn-open').disabled = !running;
}

function renderSandbox() {
  const sandbox = state.sandbox || {};
  const running = !!sandbox.running;
  $('sb-dot').className = 'dot ' + (running ? 'on' : 'off');
  $('sb-text').textContent = running
    ? '沙箱运行中'
    : (sandbox.initialized ? '沙箱未运行' : '沙箱未初始化');
  $('btn-sb-open').disabled = !running;
}

async function refresh() {
  state = await api('status');
  renderVersion();
  renderModes();
  renderSlots();
  renderScience();
  renderSandbox();
  $('request-log').checked = state.request_log !== false;
  $('web-search').checked = state.web_search !== false;
}

// 周期轮询只刷状态,不重绘配置表单,也不给两个开关赋值:否则用户填到一半的地址、
// 模型槽会被无声覆盖回已保存值,正在提交的开关会被弹回去。
async function poll() {
  state = await api('status');
  renderVersion();
  renderModes();
  renderScience();
  renderSandbox();
}

async function switchMode(mode, force) {
  if (mode === state.mode) return;
  try {
    const result = await api('switch', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(force ? { mode, force: true } : { mode }),
    });
    scienceUrl = result.url || null;
    msg($('mode-msg'), result.science_restarted
      ? `已切换到${result.mode_label},Science 已重启。`
      : `已切换到${result.mode_label}。启动 Science 后生效。`);
    await refresh();
  } catch (error) {
    // 有会话在跑时服务会要求确认,而不是默默打断它们。
    if (!force && /会话正在进行/.test(error.message)) {
      if (confirm(error.message + '\n\n仍要切换吗?')) return switchMode(mode, true);
      return;
    }
    msg($('mode-msg'), '切换失败:' + error.message, 'err');
  }
}

// 成功提示按响应如实写:沙箱没在运行时只是存了下来,要到下次启动才用上。
function sandboxSwitchNote(result) {
  if (!result.changed) return `沙箱的渠道已经是${result.mode_label},没有变化。`;
  return result.sandbox_restarted
    ? `沙箱已切换到${result.mode_label}并重启。`
    : `沙箱渠道已设为${result.mode_label},下次启动沙箱时生效。`;
}

// 切换免登录沙箱的渠道。只动沙箱:正式实例的模式不变,也不会被重启。
async function switchSandboxMode(mode) {
  if (sandboxSwitching || mode === state.sandbox_mode) return;
  const request = (force) => api('sandbox/switch', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(force ? { mode, force: true } : { mode }),
  });
  sandboxSwitching = true;
  renderModes();
  try {
    let result;
    try {
      result = await request(false);
    } catch (error) {
      // 沙箱在跑时服务会要求确认,而不是默默重启它。被拒绝时服务端什么都没改,
      // 所以取消就到此为止,界面也不用动。
      if (!/沙箱正在运行/.test(error.message)) throw error;
      if (!confirm(error.message + '\n\n仍要切换吗?')) return;
      result = await request(true);
    }
    msg($('sb-msg'), sandboxSwitchNote(result));
  } catch (error) {
    msg($('sb-msg'), '切换失败:' + error.message, 'err');
  } finally {
    sandboxSwitching = false;
    // 不猜结果:「重启失败」发生在存盘之后,选中态以服务端当前状态为准;
    // 问不到就按手头的状态把卡片放开。只刷状态,不重绘渠道配置表单。
    await poll().catch(() => renderModes());
  }
}

$('tabs').onclick = (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  channel = tab.dataset.ch;
  document.querySelectorAll('.tab').forEach((element) => {
    element.setAttribute('aria-selected', String(element.dataset.ch === channel));
  });
  renderSlots();
};

$('cfg').onsubmit = async (event) => {
  event.preventDefault();
  const payload = { channel, base_url: $('base').value, api_key: $('key').value };
  SLOTS.forEach((slot) => { payload[slot.key] = { model_id: '', display_name: '' }; });
  document.querySelectorAll('#slots input').forEach((input) => {
    payload[input.dataset.slot][input.dataset.part] = input.value.trim();
  });
  try {
    const result = await api('config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    $('key').value = '';
    msg($('cfg-msg'), result.note || '已保存');
    await refresh();
  } catch (error) {
    msg($('cfg-msg'), '保存失败:' + error.message, 'err');
  }
};

$('btn-probe').onclick = async () => {
  $('probe-note').textContent = '正在拉取…';
  try {
    const result = await api('probe-models', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ base_url: $('base').value, api_key: $('key').value, channel }),
    });
    const models = result.models || [];
    $('probe-note').textContent = models.length
      ? '可用:' + models.map((model) => model.id).join('、')
      : '上游未返回模型';
  } catch (error) {
    $('probe-note').textContent = '拉取失败:' + error.message;
  }
};

$('btn-start').onclick = async () => {
  try {
    const result = await api('science/start', { method: 'POST' });
    scienceUrl = result.url || null;
    msg($('mode-msg'), 'Science 已启动。');
    await refresh();
  } catch (error) {
    msg($('mode-msg'), '启动失败:' + error.message, 'err');
  }
};

$('btn-stop').onclick = async () => {
  try {
    await api('science/stop', { method: 'POST' });
    msg($('mode-msg'), 'Science 已停止。');
    await refresh();
  } catch (error) {
    msg($('mode-msg'), '停止失败:' + error.message, 'err');
  }
};

$('btn-open').onclick = async () => {
  try {
    const result = await api('science/url');
    window.open(result.url, '_blank');
  } catch (error) {
    msg($('mode-msg'), '获取链接失败:' + error.message, 'err');
  }
};

$('btn-sb-start').onclick = async () => {
  try {
    const result = await api('sandbox/start', { method: 'POST' });
    msg($('sb-msg'), result.action === 'already-running' ? '沙箱已在运行。' : '沙箱已启动。');
    if (result.url) window.open(result.url, '_blank');
    await refresh();
  } catch (error) {
    msg($('sb-msg'), '启动失败:' + error.message, 'err');
  }
};

$('btn-sb-stop').onclick = async () => {
  try {
    await api('sandbox/stop', { method: 'POST' });
    msg($('sb-msg'), '沙箱已停止。');
    await refresh();
  } catch (error) {
    msg($('sb-msg'), '停止失败:' + error.message, 'err');
  }
};

$('btn-sb-open').onclick = async () => {
  try {
    const result = await api('sandbox/url');
    window.open(result.url, '_blank');
  } catch (error) {
    msg($('sb-msg'), '获取链接失败:' + error.message, 'err');
  }
};

$('btn-quit').onclick = async () => {
  if (!confirm('退出 CSSwitch 服务?\n\n会先停止正在运行的 Science 与免登录沙箱,进行中的会话会被打断。')) return;
  // 服务要先停完实例才回话,这几秒里按钮不能再点。
  $('btn-quit').disabled = true;
  $('btn-quit').textContent = '正在停止实例…';
  let result = null;
  try {
    result = await api('quit', { method: 'POST' });
  } catch (error) {
    // 没拿到响应:服务多半已经退出,只是停止结果未知。
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h2>服务已退出</h2>';
  const line = (text, className) => {
    const p = document.createElement('p');
    p.className = className;
    p.textContent = text;
    card.append(p);
  };
  if (!result) {
    line('没有收到停止结果,请自行确认 Science 与免登录沙箱是否仍在运行。', 'msg err show');
  } else {
    const stopped = result.stopped || [];
    const errors = result.errors || [];
    if (stopped.length) line(`已停止:${stopped.join('、')}。`, 'sub');
    else if (!errors.length) line('没有正在运行的 Science 或免登录沙箱。', 'sub');
    // 停止失败不拦截退出,原文逐条展示,方便手动收尾。
    errors.forEach((error) => line(error, 'msg err show'));
  }
  card.insertAdjacentHTML('beforeend',
    '<p class="sub">重新打开 CSSwitch 即可再次启动。</p>');
  document.querySelector('.wrap').replaceChildren(card);
};

// 成功提示按响应逐项拼,每一句只说已经成立、且用户需要知道的事。
function webSearchNote(result) {
  if (!result.changed) return '联网搜索设置没有变化。';
  const parts = [result.web_search ? '已开启联网搜索。' : '已关闭联网搜索。'];
  if (result.science_restarted) parts.push('Science 已重启。');
  if (result.sandbox_restart_required) parts.push('沙箱要重启后才生效。');
  return parts.join('');
}

// 改动即提交。失败时不猜结果:重启失败那一类错误发生在存盘之后,
// 所以以服务端当前状态为准重新赋值,问不到才退回操作前的勾选。
async function setWebSearch(enabled, force) {
  const box = $('web-search');
  box.disabled = true;
  try {
    const result = await api('web-search', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(force ? { enabled, force: true } : { enabled }),
    });
    box.checked = result.web_search;
    if (result.science_restarted) scienceUrl = result.url || null;
    msg($('mode-msg'), webSearchNote(result));
    await poll().catch(() => {});
  } catch (error) {
    // 有会话在跑时服务会要求确认,而不是默默打断它们;此时服务端什么都没改。
    if (!force && /会话正在进行/.test(error.message)) {
      // await 是必需的:否则 finally 会在重试还没回来时就把复选框放开。
      if (confirm(error.message + '\n\n仍要切换吗?')) return await setWebSearch(enabled, true);
      box.checked = !enabled;
      return;
    }
    try {
      await poll();
      box.checked = state.web_search !== false;
    } catch (unreachable) {
      box.checked = !enabled;
    }
    msg($('mode-msg'), '切换失败:' + error.message, 'err');
  } finally {
    box.disabled = false;
  }
}

$('web-search').onchange = (event) => setWebSearch(event.target.checked);

$('request-log').onchange = async (event) => {
  const enabled = event.target.checked;
  try {
    const result = await api('logging', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ request_log: enabled }),
    });
    state.request_log = result.request_log;
    msg($('log-msg'), enabled ? '已开启请求日志。' : '已关闭请求日志。');
  } catch (error) {
    // 服务端没存上,勾选状态回滚,界面不能和实际行为不一致。
    event.target.checked = !enabled;
    msg($('log-msg'), '切换失败:' + error.message, 'err');
  }
};

$('btn-logs').onclick = async () => {
  const result = await api('logs');
  const entries = (result.entries || []).slice().reverse();
  $('logs').innerHTML = entries.length ? entries.map((entry) => {
    const detail = entry.detail || {};
    const time = new Date(entry.ts_ms).toLocaleTimeString();
    // 谁发来的、走了哪个渠道:两个实例各有各的模式,只写渠道分不清是哪一边。
    const route = detail.mode ? `${INSTANCES[detail.instance] || '—'} · ${detail.mode}` : '—';
    return `<tr>
      <td>${time}</td><td>${route}</td><td>${detail.method || '—'}</td>
      <td><code>${detail.path || '—'}</code></td>
      <td>${detail.error ? '<span style="color:var(--err)">错误</span>' : (detail.status || '—')}</td>
      <td>${detail.ms != null ? detail.ms + ' ms' : '—'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="sub">暂无记录</td></tr>';
};

refresh().catch((error) => {
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
    `<div class="card" style="border-color:var(--err)">无法连接本地服务:${error.message}</div>`);
});
setInterval(() => poll().catch(() => {}), 15000);
</script>
</body>
