<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSSwitch</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #ffffff; --line: #e8e3dc; --ink: #1f1d1b;
    --muted: #6f6862; --accent: #c96442; --accent-soft: #f6ece8;
    --ok: #2f7d5b; --warn: #a8621b; --err: #b4402c;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917; --panel: #232120; --line: #35312e; --ink: #f2efec;
      --muted: #a39b94; --accent: #e07a55; --accent-soft: #33261f;
      --ok: #6fce9f; --warn: #e0a35a; --err: #ef8a76;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px 22px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .3px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mode {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    background: transparent; color: var(--ink); cursor: pointer; text-align: left;
    font: inherit; transition: border-color .15s, background .15s;
  }
  .mode:hover { border-color: var(--accent); }
  .mode[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .mode b { display: block; font-size: 15px; margin-bottom: 3px; }
  .mode span { color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--err); }
  button.act {
    font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 7px 14px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.act:disabled { opacity: .5; cursor: default; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    font: inherit; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 6px 4px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 5px; }
  input {
    width: 100%; font: inherit; padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0; }
  legend { font-size: 12px; color: var(--muted); padding: 0 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: -6px; margin-bottom: 14px; }
  .msg { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-top: 12px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: var(--accent-soft); color: var(--ok); }
  .msg.err { background: var(--accent-soft); color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .logwrap { max-height: 300px; overflow: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CSSwitch</h1>
    <span class="sub">Claude Science 模型连接</span>
  </header>

  <section class="card">
    <h2>当前连接</h2>
    <div class="modes" id="modes"></div>
    <div class="row" style="margin-top:16px">
      <span class="pill"><span class="dot" id="sci-dot"></span><span id="sci-text">检查中…</span></span>
      <span class="pill">网关 <code id="base-url">—</code></span>
      <button class="act" id="btn-start">启动 Science</button>
      <button class="act" id="btn-stop">停止</button>
      <button class="act" id="btn-open">打开 Science</button>
      <button class="act" id="btn-quit" style="margin-left:auto">退出服务</button>
    </div>
    <div class="msg" id="mode-msg"></div>
  </section>

  <section class="card">
    <h2>渠道配置</h2>
    <div class="tabs" id="tabs">
      <button class="tab" data-ch="kimi" aria-selected="true">Kimi</button>
      <button class="tab" data-ch="deepseek" aria-selected="false">DeepSeek</button>
    </div>
    <form id="cfg">
      <div class="field">
        <label for="base">地址 base_url</label>
        <input id="base" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="key">API Key</label>
        <input id="key" type="password" autocomplete="off" placeholder="已保存,留空则保持不变">
      </div>
      <div class="row" style="margin-bottom:12px">
        <button type="button" class="act" id="btn-probe">获取可用模型</button>
        <span class="sub" id="probe-note">从上游拉取模型清单</span>
      </div>
      <div class="slots" id="slots"></div>
      <p class="hint" style="margin-top:14px">
        默认模型必填;高质量、快速与 Fable 留空时自动继承默认模型。
        模型 ID 用于上游请求,显示名用于 Science 的模型菜单。
      </p>
      <div class="row">
        <button type="submit" class="act primary">保存配置</button>
        <span class="sub">保存只更新配置;运行中的链路不变,下次切换或重启 Science 时生效。</span>
      </div>
      <div class="msg" id="cfg-msg"></div>
    </form>
  </section>

  <section class="card">
    <h2>请求日志</h2>
    <div class="row" style="margin-bottom:12px">
      <button class="act" id="btn-logs">刷新</button>
      <span class="sub">仅记录方法、路径、状态与耗时,不含任何凭证或消息内容。</span>
    </div>
    <div class="logwrap">
      <table>
        <thead><tr><th>时间</th><th>模式</th><th>方法</th><th>路径</th><th>状态</th><th>耗时</th></tr></thead>
        <tbody id="logs"><tr><td colspan="6" class="sub">暂无记录</td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
const MODES = [
  { id: 'official', name: '官方 Claude', desc: '直连 api.anthropic.com' },
  { id: 'kimi',     name: 'Kimi',        desc: 'api.kimi.com/coding' },
  { id: 'deepseek', name: 'DeepSeek',    desc: 'api.deepseek.com/anthropic' },
];
const SLOTS = [
  { key: 'default_model', label: '默认模型(均衡)', required: true },
  { key: 'quality_model', label: '高质量模型(可选)' },
  { key: 'fast_model',    label: '快速模型(可选)' },
  { key: 'fable_model',   label: 'Fable 模型(可选)' },
];
let state = null;
let channel = 'kimi';
let scienceUrl = null;

const $ = (id) => document.getElementById(id);

function msg(el, text, kind) {
  el.textContent = text;
  el.className = 'msg show ' + (kind || 'ok');
  if (kind !== 'err') setTimeout(() => { el.className = 'msg'; }, 6000);
}

async function api(path, options) {
  const response = await fetch('/control/' + path, options);
  const data = await response.json().catch(() => ({ error: '响应不是 JSON' }));
  if (!response.ok) throw new Error(data.error || ('HTTP ' + response.status));
  return data;
}

function renderModes() {
  $('modes').innerHTML = MODES.map((mode) => `
    <button class="mode" data-mode="${mode.id}" aria-pressed="${state.mode === mode.id}">
      <b>${mode.name}</b><span>${mode.desc}</span>
    </button>`).join('');
  document.querySelectorAll('.mode').forEach((button) => {
    button.onclick = () => switchMode(button.dataset.mode);
  });
}

function renderSlots() {
  const config = state.channels[channel];
  $('base').value = config.base_url || '';
  $('key').placeholder = config.has_api_key ? '已保存,留空则保持不变' : '尚未配置';
  $('slots').innerHTML = SLOTS.map((slot) => {
    const value = config[slot.key] || { model_id: '', display_name: '' };
    return `<fieldset>
      <legend>${slot.label}</legend>
      <div class="field">
        <label>模型 ID</label>
        <input data-slot="${slot.key}" data-part="model_id" value="${value.model_id || ''}"
               placeholder="${slot.required ? '必填' : '留空则继承默认模型'}" spellcheck="false">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>显示名称(可选)</label>
        <input data-slot="${slot.key}" data-part="display_name" value="${value.display_name || ''}"
               placeholder="留空则使用模型 ID" spellcheck="false">
      </div>
    </fieldset>`;
  }).join('');
}

function renderScience() {
  const science = state.science || {};
  const running = !!science.running;
  $('sci-dot').className = 'dot ' + (running ? 'on' : 'off');
  $('sci-text').textContent = !science.installed
    ? '未找到 Claude Science'
    : (running ? 'Science 运行中' : 'Science 未运行');
  $('base-url').textContent = state.base_url;
  $('btn-open').disabled = !running;
}

async function refresh() {
  state = await api('status');
  renderModes();
  renderSlots();
  renderScience();
}

async function switchMode(mode, force) {
  if (mode === state.mode) return;
  try {
    const result = await api('switch', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(force ? { mode, force: true } : { mode }),
    });
    scienceUrl = result.url || null;
    msg($('mode-msg'), result.science_restarted
      ? `已切换到${result.mode_label},Science 已重启。`
      : `已切换到${result.mode_label}。启动 Science 后生效。`);
    await refresh();
  } catch (error) {
    // 有会话在跑时服务会要求确认,而不是默默打断它们。
    if (!force && /会话正在进行/.test(error.message)) {
      if (confirm(error.message + '\n\n仍要切换吗?')) return switchMode(mode, true);
      return;
    }
    msg($('mode-msg'), '切换失败:' + error.message, 'err');
  }
}

$('tabs').onclick = (event) => {
  const tab = event.target.closest('.tab');
  if (!tab) return;
  channel = tab.dataset.ch;
  document.querySelectorAll('.tab').forEach((element) => {
    element.setAttribute('aria-selected', String(element.dataset.ch === channel));
  });
  renderSlots();
};

$('cfg').onsubmit = async (event) => {
  event.preventDefault();
  const payload = { channel, base_url: $('base').value, api_key: $('key').value };
  SLOTS.forEach((slot) => { payload[slot.key] = { model_id: '', display_name: '' }; });
  document.querySelectorAll('#slots input').forEach((input) => {
    payload[input.dataset.slot][input.dataset.part] = input.value.trim();
  });
  try {
    const result = await api('config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    $('key').value = '';
    msg($('cfg-msg'), result.note || '已保存');
    await refresh();
  } catch (error) {
    msg($('cfg-msg'), '保存失败:' + error.message, 'err');
  }
};

$('btn-probe').onclick = async () => {
  $('probe-note').textContent = '正在拉取…';
  try {
    const result = await api('probe-models', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ base_url: $('base').value, api_key: $('key').value, channel }),
    });
    const models = result.models || [];
    $('probe-note').textContent = models.length
      ? '可用:' + models.map((model) => model.id).join('、')
      : '上游未返回模型';
  } catch (error) {
    $('probe-note').textContent = '拉取失败:' + error.message;
  }
};

$('btn-start').onclick = async () => {
  try {
    const result = await api('science/start', { method: 'POST' });
    scienceUrl = result.url || null;
    msg($('mode-msg'), 'Science 已启动。' + (scienceUrl ? '' : '可用「打开 Science」获取登录链接。'));
    await refresh();
  } catch (error) {
    msg($('mode-msg'), '启动失败:' + error.message, 'err');
  }
};

$('btn-stop').onclick = async () => {
  try {
    await api('science/stop', { method: 'POST' });
    msg($('mode-msg'), 'Science 已停止。');
    await refresh();
  } catch (error) {
    msg($('mode-msg'), '停止失败:' + error.message, 'err');
  }
};

$('btn-open').onclick = async () => {
  try {
    const result = await api('science/url');
    window.open(result.url, '_blank');
  } catch (error) {
    msg($('mode-msg'), '获取链接失败:' + error.message, 'err');
  }
};

$('btn-quit').onclick = async () => {
  if (!confirm('退出 CSSwitch 服务?Science 会继续运行,但模型请求将无法送达。')) return;
  try {
    await api('quit', { method: 'POST' });
  } catch (error) {
    // 服务可能在响应写完后立刻退出,连接中断不算失败。
  }
  document.querySelector('.wrap').innerHTML =
    '<div class="card"><h2>服务已退出</h2>' +
    '<p class="sub">重新运行 <code>./csswitch</code> 即可再次启动。</p></div>';
};

$('btn-logs').onclick = async () => {
  const result = await api('logs');
  const entries = (result.entries || []).slice().reverse();
  $('logs').innerHTML = entries.length ? entries.map((entry) => {
    const detail = entry.detail || {};
    const time = new Date(entry.ts_ms).toLocaleTimeString();
    return `<tr>
      <td>${time}</td><td>${detail.mode || '—'}</td><td>${detail.method || '—'}</td>
      <td><code>${detail.path || '—'}</code></td>
      <td>${detail.error ? '<span style="color:var(--err)">错误</span>' : (detail.status || '—')}</td>
      <td>${detail.ms != null ? detail.ms + ' ms' : '—'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="6" class="sub">暂无记录</td></tr>';
};

refresh().catch((error) => {
  document.querySelector('.wrap').insertAdjacentHTML('afterbegin',
    `<div class="card" style="border-color:var(--err)">无法连接本地服务:${error.message}</div>`);
});
setInterval(() => refresh().catch(() => {}), 15000);
</script>
</body>
</html>
